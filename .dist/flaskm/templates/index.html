<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
   
<h1>House Price Prediction</h1>
    <form method="POST" action="/predict">
        <label>Total Area:</label>
        <input type="text" name="lotarea" required><br><br>
        <label>Overall Quality:</label>
        <input type="text" name="overallquality" required><br><br>
        <label>Year Built:</label>
        <input type="text" name="yearbuilt" required><br><br>
        <label>Total Basement SF:</label>
        <input type="text" name="TotalBsmtSF" required><br><br>
        <label>Above Ground Living Area (GrLivArea):</label>
        <input type="text" name="GrLivArea" required><br><br>
        <label>Garage Cars:</label><input type="text" name="GarageCars" required><br><br>
        <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
        <h3>{{ prediction_text }}</h3>
    {% endif %}
</body>
</html>
